<html lang="en">
<head>

<body>

<header>
    <h1>✈️ Sky<span>Book</span></h1>
    <p>Flight Reservation System</p>
</header>

<section class="hero">
    <h2>Find Your Next Flight</h2>
    <p>Search flights, compare prices, and book your tickets.</p>
</section>

<main class="container">

    <section class="search-box">
        <input
            type="text"
            id="destination"
            placeholder="Enter destination (e.g. Goa)"
        >

        <select id="sortOption">
            <option value="default">Default Order</option>
            <option value="price">Price: Low to High</option>
        </select>

        <button onclick="searchFlights()">Search Flights</button>
        <button onclick="resetFlights()">Show All</button>
    </section>

    <h2 class="section-title">Available Flights</h2>

    <section id="flightList"></section>

    <section class="booking-panel" id="bookingPanel">
        <h2>🎫 Book Your Ticket</h2>

        <form id="bookingForm">
            <input
                type="text"
                id="passengerName"
                placeholder="Passenger Name"
                required
            >

            <input
                type="number"
                id="flightNumber"
                placeholder="Flight Number"
                min="1"
                required
            >

            <input
                type="number"
                id="ticketCount"
                placeholder="Number of Tickets"
                min="1"
                required
            >

            <button type="submit">Confirm Booking</button>
        </form>

        <div id="message" aria-live="polite"></div>
    </section>

</main>

<footer>
    <p>SkyBook Flight Reservation System | Data Structures Project</p>
    <p>Searching and Sorting Algorithms</p>
</footer>

<script>
    const flights = [
        {
            no: 104,
            airline: "IndiGo",
            source: "Pune",
            destination: "Delhi",
            price: 5200,
            seats: 5
        },
        {
            no: 101,
            airline: "Air India",
            source: "Mumbai",
            destination: "Pune",
            price: 2800,
            seats: 4
        },
        {
            no: 105,
            airline: "Akasa Air",
            source: "Pune",
            destination: "Goa",
            price: 3100,
            seats: 6
        },
        {
            no: 102,
            airline: "IndiGo",
            source: "Delhi",
            destination: "Mumbai",
            price: 6100,
            seats: 3
        },
        {
            no: 103,
            airline: "Air India",
            source: "Pune",
            destination: "Bengaluru",
            price: 4500,
            seats: 2
        }
    ];

    const bookings = [];

    function displayFlights(data) {
        const list = document.getElementById("flightList");
        list.innerHTML = "";

        if (data.length === 0) {
            list.innerHTML = "<p>No matching flights found.</p>";
            return;
        }

        data.forEach(flight => {
            const card = document.createElement("article");
            card.className = "flight-card";

            const title = document.createElement("h3");
            title.textContent = `${flight.airline} | Flight ${flight.no}`;

            const route = document.createElement("div");
            route.className = "route";
            route.textContent =
                `${flight.source} → ${flight.destination}`;

            const seats = document.createElement("p");
            seats.textContent = `Available Seats: ${flight.seats}`;

            const price = document.createElement("div");
            price.className = "price";
            price.textContent = `₹${flight.price.toLocaleString("en-IN")}`;

            const bookButton = document.createElement("button");
            bookButton.textContent = "Book This Flight";
            bookButton.type = "button";
            bookButton.addEventListener("click", () => {
                document.getElementById("flightNumber").value = flight.no;
                document.getElementById("bookingPanel").scrollIntoView({
                    behavior: "smooth"
                });
                document.getElementById("passengerName").focus();
            });

            card.append(title, route, seats, price, bookButton);
            list.appendChild(card);
        });
    }

    function searchFlights() {
        const destination = document
            .getElementById("destination")
            .value.trim()
            .toLowerCase();

        let result = flights.filter(flight =>
            flight.destination.toLowerCase().includes(destination)
        );

        // Searching is implemented here using JavaScript array filtering.
        // The Python Linear Search algorithm is in the Python project.

        if (document.getElementById("sortOption").value === "price") {
            result.sort((a, b) => a.price - b.price);
        }

        displayFlights(result);
    }

    function resetFlights() {
        document.getElementById("destination").value = "";
        document.getElementById("sortOption").value = "default";
        displayFlights(flights);
    }

    document.getElementById("sortOption").addEventListener("change", () => {
        searchFlights();
    });

    document.getElementById("bookingForm").addEventListener(
        "submit",
        function(event) {
            event.preventDefault();

            const name = document
                .getElementById("passengerName")
                .value.trim();

            const number = Number(
                document.getElementById("flightNumber").value
            );

            const count = Number(
                document.getElementById("ticketCount").value
            );

            const flight = flights.find(f => f.no === number);
            const message = document.getElementById("message");

            if (!name || !Number.isInteger(count) || count <= 0) {
                message.textContent = "Please enter valid booking details.";
                return;
            }

            if (!flight) {
                message.textContent = "Flight not found.";
                return;
            }

            if (flight.seats < count) {
                message.textContent =
                    `Only ${flight.seats} seat(s) are available.`;
                return;
            }

            flight.seats -= count;

            const booking = {
                id: bookings.length + 1,
                name: name,
                flight: flight.no,
                tickets: count,
                total: flight.price * count
            };

            bookings.push(booking);

            message.replaceChildren();

            const heading = document.createElement("h3");
            heading.textContent = "✅ Booking Successful!";

            const details = document.createElement("p");
            details.textContent =
                `Booking ID: ${booking.id} | Passenger: ${booking.name} | ` +
                `Flight: ${booking.flight} | Tickets: ${booking.tickets} | ` +
                `Total: ₹${booking.total.toLocaleString("en-IN")}`;

            message.append(heading, details);

            displayFlights(flights);
            this.reset();
        }
    );

    displayFlights(flights);
</script>

</body>
</html>
